name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-build-and-test:
    name: Linux (Ubuntu 24.04 / Java 21 / Docker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codesentinel
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: codesentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codesentinel" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build sandbox runner images
        run: ./scripts/build-sandbox-images.sh
      - name: Test (engine, judge, backend)
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck, tests & build
        run: cd frontend && npm ci && npx tsc -b && npm test && npm run build

  windows-cross-platform-test:
    name: Windows (Server 2022 / Java 21 / PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/windows/*.ps1 | ForEach-Object {
            Write-Host "Validating $($_.Name)..."
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              Write-Error "Syntax error in $($_.Name): $errors"
              exit 1
            }
          }
          Write-Host "All 8 PowerShell scripts parsed successfully without syntax errors."
      - name: Test engine & judge cross-platform units
        shell: pwsh
        run: |
          mvn -B test -pl engine,judge
      - name: Frontend tests on Windows
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npx tsc -b
          npm test
          npm run build
